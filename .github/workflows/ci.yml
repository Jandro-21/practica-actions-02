name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm insta

      - name: Usar secreto sin exponerlo
        env:
          MI_SECRETO: ${{ secrets.SALUDO_SECRETO }}
        run: echo "El secreto tiene $(echo -n "$MI_SECRETO" | wc -c) caracteres"

      - run: npm test

      - name: Avisar de fallo
        if: failure()
        run: echo "Algún step anterior ha fallado"

  solo-en-main:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Esto solo se ve en main"